<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频投票</title>
<style>
  :root{--bg:#f5f7fa;--cb:#fff;--tx:#1a1a2e;--ts:#6b7280;--ac:#6366f1;--al:#e0e7ff;--bd:#e5e7eb;--sh:0 1px 3px rgba(0,0,0,.08);--sl:0 4px 12px rgba(0,0,0,.1)}
  @media(prefers-color-scheme:dark){:root{--bg:#0f172a;--cb:#1e293b;--tx:#f1f5f9;--ts:#94a3b8;--ac:#818cf8;--al:#312e81;--bd:#334155;--sh:0 1px 3px rgba(0,0,0,.3);--sl:0 4px 12px rgba(0,0,0,.4)}}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh}
  .hd{background:linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7);color:#fff;text-align:center;padding:36px 20px 28px}
  .hd h1{font-size:24px;font-weight:700;margin-bottom:4px}
  .hd p{font-size:13px;opacity:.9}
  .ct{max-width:700px;margin:0 auto;padding:16px 12px 80px}
  .cd{background:var(--cb);border-radius:12px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden;transition:box-shadow .2s}
  .cd:hover{box-shadow:var(--sl)}
  .cd.voted{outline:2px solid var(--ac);outline-offset:-2px}
  .ch{display:flex;align-items:center;padding:12px 16px;gap:10px;border-bottom:1px solid var(--bd)}
  .nm{width:30px;height:30px;background:var(--ac);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
  .tt{font-size:14px;font-weight:600;flex:1}
  .bg{font-size:11px;color:var(--ts);background:var(--al);padding:2px 8px;border-radius:10px}
  .pa{padding:8px 16px;background:var(--bg)}
  .sn{font-size:12px;color:var(--ts);margin-bottom:4px;font-style:italic}
  audio{width:100%;height:38px;border-radius:8px;outline:none}
  .vr{padding:10px 16px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--bd)}
  .vb{padding:7px 20px;border:2px solid var(--ac);background:transparent;color:var(--ac);border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
  .vb:hover{background:var(--al)}
  .vb.on{background:var(--ac);color:#fff}
  .ck{font-size:18px;color:var(--ac);opacity:0;transition:opacity .2s}
  .ck.on{opacity:1}
  .bar{position:fixed;bottom:0;left:0;right:0;background:var(--cb);border-top:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:center;gap:8px;box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100;flex-wrap:wrap}
  .btn{padding:8px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
  .bp{background:var(--ac);color:#fff}
  .bp:hover{opacity:.9}
  .bs{background:var(--al);color:var(--ac)}
  .bs:hover{opacity:.85}
  .bdg{background:#f59e0b;color:#fff}
  .bdg:hover{opacity:.9}
  .pr{font-size:12px;color:var(--ts);align-self:center}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#10b981;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:200;transition:transform .3s}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;justify-content:center;align-items:center;padding:16px}
  .ov.show{display:flex}
  .ml{background:var(--cb);border-radius:12px;padding:20px;max-width:560px;width:100%;max-height:82vh;overflow-y:auto;box-shadow:var(--sl)}
  .ml h2{margin-bottom:12px;font-size:17px}
  .rr{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
  .rr:last-child{border:none}
  .rk{font-weight:700;color:var(--ac);width:28px;font-size:15px}
  .rn{flex:1;font-size:13px}
  .rv{font-weight:700;color:#f59e0b;font-size:14px;min-width:36px;text-align:right}
  .bar-g{height:8px;background:var(--al);border-radius:4px;flex:0 0 100px;overflow:hidden}
  .bar-f{height:100%;background:var(--ac);border-radius:4px;transition:width .3s}
  .cb{margin-top:12px;width:100%}
  .pw{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;justify-content:center;align-items:center}
  .pw-box{background:var(--cb);border-radius:12px;padding:20px;width:280px;text-align:center}
  .pw-box input{width:100%;padding:8px 12px;border:2px solid var(--bd);border-radius:8px;font-size:14px;margin:10px 0;text-align:center}
  .pw-box input:focus{outline:none;border-color:var(--ac)}
  @media(max-width:480px){.hd h1{font-size:20px}.ch{padding:10px 12px}.vr{padding:8px 12px}.bar-g{flex:0 0 60px}}
</style>
</head>
<body>

<div class="hd">
  <h1>🎵 音频投票</h1>
  <p>试听后点击「投一票」为你喜欢的音频投票，可多选</p>
</div>

<div class="ct" id="tracks"></div>

<div class="bar">
  <span class="pr" id="prg">已投 0 首</span>
  <button class="btn bs" onclick="clearSel()">清空选择</button>
  <button class="btn bp" onclick="submit()">提交投票</button>
  <button class="btn bdg" onclick="showAdmin()">📊 后台数据</button>
</div>

<div class="toast" id="toast"></div>

<div class="ov" id="ov" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="ml">
    <h2 id="mTitle">📊 综合投票数据</h2>
    <div id="mBody"></div>
    <button class="btn bp cb" onclick="document.getElementById('ov').classList.remove('show')">关闭</button>
  </div>
</div>

<script>
var T=[
  {id:1,  t:"1号 - The Bride",       mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231010361.mp3"},
  {id:2,  t:"2号 - Skotta",           mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231000801.mp3"},
  {id:3,  t:"3号 - Blues Clues",      mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231000854.mp3"},
  {id:4,  t:"4号 - Blue Brook",       mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231003147.mp3"},
  {id:5,  t:"5号 - 雾山",             mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231131428.mp3"},
  {id:6,  t:"6号 - Finding Home",     mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231161534.mp3"},
  {id:7,  t:"7号 - Achoo",            mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231022510.mp3"},
  {id:8,  t:"8号 - Puppy Love",       mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231024421.mp3"},
  {id:9,  t:"9号 - Sunset Cruise",    mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231009614.mp3"},
  {id:10, t:"10号 - Nippon",          mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231000149.mp3"},
  {id:11, t:"11号 - Morning Bliss",   mp3:"https://gossv-vcg.cfp.cn/music/preview/VCG231023923.mp3"},
  {id:12, t:"12号 - Snow",            mp3:"https://music.163.com/song/media/outer/url?id=3950545"},
  {id:13, t:"13号 - 浮槎",            mp3:"https://music.163.com/song/media/outer/url?id=1366031349"},
  {id:14, t:"14号 - The Little Things",mp3:"https://music.163.com/song/media/outer/url?id=3351188041"},
  {id:15, t:"15号 - 胡笳十八拍(古琴)",mp3:"https://music.163.com/song/media/outer/url?id=5281526"},
  {id:16, t:"16号 - 梅花三弄",        mp3:"https://music.163.com/song/media/outer/url?id=34002575"},
  {id:17, t:"17号 - 十面埋伏",        mp3:"https://music.163.com/song/media/outer/url?id=5267454"},
  {id:18, t:"18号 - 紫竹调",          mp3:"https://music.163.com/song/media/outer/url?id=27836971"}
];

var BIN='https://api.npoint.io/7191bfb3d97752de329e';
var sel={};
var busy=false;

function api(method,data){
  var opt={method:method,headers:{'Content-Type':'application/json'}};
  if(data) opt.body=JSON.stringify(data);
  return fetch(BIN,opt).then(function(r){return r.json()});
}

// Pause other audio on play
document.addEventListener('play',function(e){var a=document.getElementsByTagName('audio');for(var i=0;i<a.length;i++)if(a[i]!==e.target)a[i].pause()},true);

function plr(t){
  return '<audio controls preload="none" src="'+t.mp3+'"></audio>';
}

function render(){
  var c=document.getElementById('tracks');
  c.innerHTML=T.map(function(t){
    var v=sel[t.id];
    return '<div class="cd'+(v?' voted':'')+'" id="c'+t.id+'">'+
      '<div class="ch"><div class="nm">'+t.id+'</div><div class="tt">'+t.t+'</div>'+
      '<span class="bg">'+(t.mp3?'VCG':'网易云')+'</span></div>'+
      '<div class="pa"><div class="sn">'+t.t.replace(/^\d+号\s*-?\s*/,'')+'</div>'+plr(t)+'</div>'+
      '<div class="vr">'+
        '<button class="vb'+(v?' on':'')+'" onclick="toggle('+t.id+')">👍 投一票</button>'+
        '<span class="ck'+(v?' on':'')+'">✓</span>'+
      '</div></div>';
  }).join('');
  upd();
}

function toggle(id){
  if(sel[id]) delete sel[id]; else sel[id]=1;
  render();
}

function upd(){
  document.getElementById('prg').textContent='已投 '+Object.keys(sel).length+' 首';
}

function clearSel(){
  if(Object.keys(sel).length===0) return;
  sel={};
  render();
  toast('已清空选择');
}

function submit(){
  var n=Object.keys(sel).length;
  if(n===0){toast('请至少投一首','#ef4444');return;}
  if(busy){toast('提交中，请稍候','#f59e0b');return;}
  busy=true;
  toast('提交中...','#6366f1');
  var myVotes=Object.keys(sel);
  api('GET').then(function(d){
    if(!d||!d.votes) d={votes:{},subCnt:0};
    myVotes.forEach(function(id){d.votes[id]=(d.votes[id]||0)+1;});
    d.subCnt=(d.subCnt||0)+1;
    return api('POST',d);
  }).then(function(){
    sel={};
    render();
    busy=false;
    toast('投票成功！感谢参与 🎉');
  }).catch(function(){
    busy=false;
    toast('网络错误，请重试','#ef4444');
  });
}

function showAdmin(){
  var pw=prompt('请输入管理密码：');
  if(pw!=='8888'){if(pw!==null)toast('密码错误','#ef4444');return;}
  toast('加载中...','#6366f1');
  api('GET').then(function(d){
    if(!d||!d.votes) d={votes:{},subCnt:0};
    var total=d.votes, subCnt=d.subCnt||0;
    var sum=0,maxV=0;
    T.forEach(function(t){sum+=(total[t.id]||0);if((total[t.id]||0)>maxV)maxV=total[t.id]||0;});
    if(maxV===0)maxV=1;
    var sorted=T.map(function(t){return{id:t.id,t:t.t,v:total[t.id]||0}})
      .sort(function(a,b){return b.v-a.v});
    document.getElementById('mTitle').textContent='📊 综合投票数据（共 '+sum+' 票 / '+subCnt+' 次提交）';
    document.getElementById('mBody').innerHTML=sorted.map(function(r,i){
      var pct=Math.round(r.v/maxV*100);
      return '<div class="rr"><span class="rk">'+(i+1)+'</span>'+
        '<span class="rn">'+r.t+'</span>'+
        '<div class="bar-g"><div class="bar-f" style="width:'+pct+'%"></div></div>'+
        '<span class="rv">'+r.v+'票</span></div>';
    }).join('')+
      '<div style="margin-top:14px;display:flex;gap:8px">'+
      '<button class="btn bs" style="flex:1;font-size:12px" onclick="copyData()">📋 复制数据</button>'+
      '<button class="btn bs" style="flex:1;font-size:12px" onclick="resetData()">🗑️ 清空数据</button></div>';
    document.getElementById('ov').classList.add('show');
  }).catch(function(){
    toast('网络错误','#ef4444');
  });
}

function resetData(){
  if(!confirm('确定清空所有投票数据？'))return;
  api('POST',{votes:{},subCnt:0}).then(function(){
    toast('数据已清空');
    showAdmin();
  }).catch(function(){toast('网络错误','#ef4444')});
}

function copyData(){
  api('GET').then(function(d){
    if(!d||!d.votes) d={votes:{},subCnt:0};
    var total=d.votes, subCnt=d.subCnt||0, sum=0;
    T.forEach(function(t){sum+=(total[t.id]||0)});
    var sorted=T.map(function(t){return{t:t.t,v:total[t.id]||0}}).sort(function(a,b){return b.v-a.v});
    var txt='🎵 音频投票汇总 (共'+sum+'票/'+subCnt+'次提交)\n'+new Date().toLocaleString('zh-CN')+'\n\n';
    sorted.forEach(function(r,i){txt+=(i+1)+'. '+r.t+'：'+r.v+'票\n'});
    if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('已复制')})}
    else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('已复制')}
  }).catch(function(){toast('网络错误','#ef4444')});
}

function toast(msg,color){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color||'#10b981';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2500);
}

render();
</script>
</body>
</html>
